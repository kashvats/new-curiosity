version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./data:/data
      - ./backups:/workspace/backups
      - ../../:/workspace/projects
      - ./secrets:/run/secrets:ro
    environment:
      - QDRANT_URL=http://qdrant:6333
      - SEARXNG_BASE_URL=http://searxng:8080
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - BROWSER_SCREENSHOT_DIR=/data/screenshots
      - BACKUP_DIR=/workspace/backups
      - WORKSPACE_ROOT=/workspace/projects
      - IMPROVEMENT_POLICY_SIGNING_KEY=${IMPROVEMENT_POLICY_SIGNING_KEY:-}
      - IMPROVEMENT_APPROVER_CREDENTIALS_JSON=${IMPROVEMENT_APPROVER_CREDENTIALS_JSON:-}
      - IMPROVEMENT_DRY_RUN_SCHEDULER_ENABLED=${IMPROVEMENT_DRY_RUN_SCHEDULER_ENABLED:-false}
      - IMPROVEMENT_EVIDENCE_WEBHOOK_TOKEN=${IMPROVEMENT_EVIDENCE_WEBHOOK_TOKEN:-}
      - IMPROVEMENT_EVIDENCE_WEBHOOK_SIGNING_SECRET=${IMPROVEMENT_EVIDENCE_WEBHOOK_SIGNING_SECRET:-}
      - IMPROVEMENT_OPERATOR_CREDENTIALS_JSON=${IMPROVEMENT_OPERATOR_CREDENTIALS_JSON:-}
      - IMPROVEMENT_SCHEDULER_LEASE_BACKEND=${IMPROVEMENT_SCHEDULER_LEASE_BACKEND:-sqlite}
      - IMPROVEMENT_SCHEDULER_REDIS_URL=${IMPROVEMENT_SCHEDULER_REDIS_URL:-}
      - IMPROVEMENT_SCHEDULER_POSTGRES_DSN=${IMPROVEMENT_SCHEDULER_POSTGRES_DSN:-}
      - IMPROVEMENT_SCHEDULER_LEADER_ELECTION_ENABLED=${IMPROVEMENT_SCHEDULER_LEADER_ELECTION_ENABLED:-true}
      - IMPROVEMENT_ALERT_WEBHOOK_URL=${IMPROVEMENT_ALERT_WEBHOOK_URL:-}
      - IMPROVEMENT_ALERT_WEBHOOK_SIGNING_SECRET=${IMPROVEMENT_ALERT_WEBHOOK_SIGNING_SECRET:-}
      - IMPROVEMENT_OTEL_EXPORTER_ENDPOINT=${IMPROVEMENT_OTEL_EXPORTER_ENDPOINT:-}
      - IMPROVEMENT_OTEL_EXPORTER_HEADERS_JSON=${IMPROVEMENT_OTEL_EXPORTER_HEADERS_JSON:-{}}
      - IMPROVEMENT_GITHUB_WEBHOOK_SECRET=${IMPROVEMENT_GITHUB_WEBHOOK_SECRET:-}
      - IMPROVEMENT_GITLAB_WEBHOOK_TOKEN=${IMPROVEMENT_GITLAB_WEBHOOK_TOKEN:-}
      - IMPROVEMENT_SECRETS_PROVIDER=${IMPROVEMENT_SECRETS_PROVIDER:-env}
      - IMPROVEMENT_SECRETS_DIR=/run/secrets
      - IMPROVEMENT_GITHUB_STATUS_TOKEN=${IMPROVEMENT_GITHUB_STATUS_TOKEN:-}
      - IMPROVEMENT_GITLAB_STATUS_TOKEN=${IMPROVEMENT_GITLAB_STATUS_TOKEN:-}
      - IMPROVEMENT_RELEASE_ROOT=/data/releases
      - IMPROVEMENT_RELEASE_BUILD_MODE=${IMPROVEMENT_RELEASE_BUILD_MODE:-validate_only}
      - IMPROVEMENT_RELEASE_REQUIRE_CONTAINER_BUILD=${IMPROVEMENT_RELEASE_REQUIRE_CONTAINER_BUILD:-false}
      - IMPROVEMENT_RELEASE_DOCKER_NETWORK=${IMPROVEMENT_RELEASE_DOCKER_NETWORK:-none}
      - IMPROVEMENT_RELEASE_SIGNING_KEY=${IMPROVEMENT_RELEASE_SIGNING_KEY:-}
      - IMPROVEMENT_RELEASE_REQUIRE_SIGNATURE=${IMPROVEMENT_RELEASE_REQUIRE_SIGNATURE:-true}
      - IMPROVEMENT_RELEASE_REQUIRE_VULNERABILITY_REPORT=${IMPROVEMENT_RELEASE_REQUIRE_VULNERABILITY_REPORT:-true}
      - IMPROVEMENT_RELEASE_VULN_SCANNER=${IMPROVEMENT_RELEASE_VULN_SCANNER:-report_only}
      - IMPROVEMENT_STAGING_EXECUTION_ENABLED=${IMPROVEMENT_STAGING_EXECUTION_ENABLED:-false}
      - IMPROVEMENT_STAGING_CI_TRIGGER_ENABLED=${IMPROVEMENT_STAGING_CI_TRIGGER_ENABLED:-false}
      - IMPROVEMENT_STAGING_OCI_EXECUTION_ENABLED=${IMPROVEMENT_STAGING_OCI_EXECUTION_ENABLED:-false}
      - IMPROVEMENT_STAGING_PRODUCTION_DENY_TOKENS=${IMPROVEMENT_STAGING_PRODUCTION_DENY_TOKENS:-prod,production}
      - IMPROVEMENT_STAGING_GITHUB_WORKFLOW=${IMPROVEMENT_STAGING_GITHUB_WORKFLOW:-staging.yml}
      - IMPROVEMENT_GITHUB_ACTIONS_TOKEN=${IMPROVEMENT_GITHUB_ACTIONS_TOKEN:-}
      - IMPROVEMENT_GITLAB_PIPELINE_TOKEN=${IMPROVEMENT_GITLAB_PIPELINE_TOKEN:-}
      - IMPROVEMENT_RELEASE_COSIGN_ENABLED=${IMPROVEMENT_RELEASE_COSIGN_ENABLED:-false}
      - IMPROVEMENT_STAGING_AUTO_TEARDOWN_EXPIRED=${IMPROVEMENT_STAGING_AUTO_TEARDOWN_EXPIRED:-false}
      - IMPROVEMENT_PRODUCTION_REQUEST_REQUIRE_VERIFIED_OPERATOR=${IMPROVEMENT_PRODUCTION_REQUEST_REQUIRE_VERIFIED_OPERATOR:-true}
      - IMPROVEMENT_PRODUCTION_REQUEST_ALLOWED_ROLES=${IMPROVEMENT_PRODUCTION_REQUEST_ALLOWED_ROLES:-release-manager,maintainer}
      # Part 14 production release governance (authorization/package only; no deploy credentials)
      - IMPROVEMENT_PRODUCTION_GOVERNANCE_MIN_APPROVALS=${IMPROVEMENT_PRODUCTION_GOVERNANCE_MIN_APPROVALS:-2}
      - IMPROVEMENT_PRODUCTION_GOVERNANCE_REQUIRED_ROLES=${IMPROVEMENT_PRODUCTION_GOVERNANCE_REQUIRED_ROLES:-release-manager,ops}
      - IMPROVEMENT_PRODUCTION_GOVERNANCE_ALLOWED_APPROVER_ROLES=${IMPROVEMENT_PRODUCTION_GOVERNANCE_ALLOWED_APPROVER_ROLES:-release-manager,ops,security,maintainer}
      - IMPROVEMENT_PRODUCTION_GOVERNANCE_CREATOR_ROLES=${IMPROVEMENT_PRODUCTION_GOVERNANCE_CREATOR_ROLES:-release-manager,maintainer}
      - IMPROVEMENT_PRODUCTION_GOVERNANCE_EDITOR_ROLES=${IMPROVEMENT_PRODUCTION_GOVERNANCE_EDITOR_ROLES:-release-manager,maintainer,ops}
      - IMPROVEMENT_PRODUCTION_GOVERNANCE_TRAIN_ROLES=${IMPROVEMENT_PRODUCTION_GOVERNANCE_TRAIN_ROLES:-release-manager,ops}
      - IMPROVEMENT_PRODUCTION_GOVERNANCE_LOCK_ROLES=${IMPROVEMENT_PRODUCTION_GOVERNANCE_LOCK_ROLES:-release-manager}
      - IMPROVEMENT_PRODUCTION_GOVERNANCE_PACKAGE_ROLES=${IMPROVEMENT_PRODUCTION_GOVERNANCE_PACKAGE_ROLES:-release-manager,ops}
      - IMPROVEMENT_PRODUCTION_GOVERNANCE_CHANGE_TICKET_REQUIRED=${IMPROVEMENT_PRODUCTION_GOVERNANCE_CHANGE_TICKET_REQUIRED:-true}
      - IMPROVEMENT_PRODUCTION_GOVERNANCE_CHANGE_TICKET_PATTERN=${IMPROVEMENT_PRODUCTION_GOVERNANCE_CHANGE_TICKET_PATTERN:-^[A-Z][A-Z0-9]+-[0-9]+}
      - IMPROVEMENT_PRODUCTION_GOVERNANCE_FREEZE_WINDOWS_JSON=${IMPROVEMENT_PRODUCTION_GOVERNANCE_FREEZE_WINDOWS_JSON:-[]}
      - IMPROVEMENT_PRODUCTION_GOVERNANCE_DEFAULT_TIMEZONE=${IMPROVEMENT_PRODUCTION_GOVERNANCE_DEFAULT_TIMEZONE:-UTC}
      - IMPROVEMENT_PRODUCTION_GOVERNANCE_RELEASE_TRAIN_REQUIRED=${IMPROVEMENT_PRODUCTION_GOVERNANCE_RELEASE_TRAIN_REQUIRED:-false}
      - IMPROVEMENT_PRODUCTION_GOVERNANCE_RELEASE_TRAIN_WINDOW_REQUIRED=${IMPROVEMENT_PRODUCTION_GOVERNANCE_RELEASE_TRAIN_WINDOW_REQUIRED:-false}
      - IMPROVEMENT_PRODUCTION_GOVERNANCE_LOCK_REQUIRE_SIGNATURE=${IMPROVEMENT_PRODUCTION_GOVERNANCE_LOCK_REQUIRE_SIGNATURE:-true}
      - IMPROVEMENT_PRODUCTION_GOVERNANCE_PACKAGE_REQUIRE_SIGNATURE=${IMPROVEMENT_PRODUCTION_GOVERNANCE_PACKAGE_REQUIRE_SIGNATURE:-true}
      - IMPROVEMENT_PRODUCTION_GOVERNANCE_DEPLOYER_AUDIENCE=${IMPROVEMENT_PRODUCTION_GOVERNANCE_DEPLOYER_AUDIENCE:-independent-production-deployer}
      # Part 15 signed production handoff + outcome learning (still no production credentials in backend)
      - IMPROVEMENT_PRODUCTION_GOVERNANCE_ARTIFACT_BINDING_REQUIRED=${IMPROVEMENT_PRODUCTION_GOVERNANCE_ARTIFACT_BINDING_REQUIRED:-true}
      - IMPROVEMENT_PRODUCTION_AUTHORIZATION_TTL_MINUTES=${IMPROVEMENT_PRODUCTION_AUTHORIZATION_TTL_MINUTES:-10}
      - IMPROVEMENT_PRODUCTION_AUTHORIZATION_ROLES=${IMPROVEMENT_PRODUCTION_AUTHORIZATION_ROLES:-release-manager,ops}
      - IMPROVEMENT_PRODUCTION_OUTCOME_SIGNING_KEY=${IMPROVEMENT_PRODUCTION_OUTCOME_SIGNING_KEY:-}
      - IMPROVEMENT_PRODUCTION_OUTCOME_PREVIOUS_SIGNING_KEYS=${IMPROVEMENT_PRODUCTION_OUTCOME_PREVIOUS_SIGNING_KEYS:-}
      - IMPROVEMENT_CERTIFICATION_SIGNING_KEY=${IMPROVEMENT_CERTIFICATION_SIGNING_KEY:-}
      - IMPROVEMENT_CERTIFICATION_MAX_EVIDENCE_AGE_HOURS=${IMPROVEMENT_CERTIFICATION_MAX_EVIDENCE_AGE_HOURS:-168}
      - IMPROVEMENT_PRODUCTION_OUTCOME_MAX_BYTES=${IMPROVEMENT_PRODUCTION_OUTCOME_MAX_BYTES:-1000000}
      - IMPROVEMENT_PRODUCTION_LEARNING_LOOKBACK=${IMPROVEMENT_PRODUCTION_LEARNING_LOOKBACK:-100}
      - IMPROVEMENT_PRODUCTION_LEARNING_ROLLBACK_PENALTY=${IMPROVEMENT_PRODUCTION_LEARNING_ROLLBACK_PENALTY:-0.35}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    image: ai-coding-assistant-frontend:latest
    volumes:
      - ./frontend/src:/app/src
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/

  scheduler-redis:
    image: redis:7-alpine
    profiles: ["ha-redis"]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - scheduler_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  scheduler-postgres:
    image: postgres:16-alpine
    profiles: ["ha-postgres"]
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: ${SCHEDULER_POSTGRES_PASSWORD:-scheduler-dev-only}
    ports:
      - "5432:5432"
    volumes:
      - scheduler_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 10s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4318:4318"
      - "8889:8889"

  production-deployer:
    build:
      context: ./production-deployer
    profiles: ["production-deployer"]
    ports:
      - "8015:8015"
    volumes:
      - production_deployer_data:/data
      - ./production-deployer/secrets:/run/production-deployer-secrets:ro
    environment:
      - PRODUCTION_DEPLOYER_DATABASE_PATH=/data/production-deployer.db
      - PRODUCTION_DEPLOYER_EXECUTION_ENABLED=${PRODUCTION_DEPLOYER_EXECUTION_ENABLED:-false}
      - PRODUCTION_DEPLOYER_PACKAGE_SIGNING_KEY=${PRODUCTION_DEPLOYER_PACKAGE_SIGNING_KEY:-}
      - PRODUCTION_DEPLOYER_RECEIPT_SIGNING_KEY=${PRODUCTION_DEPLOYER_RECEIPT_SIGNING_KEY:-}
      - PRODUCTION_DEPLOYER_PREVIOUS_PACKAGE_SIGNING_KEYS=${PRODUCTION_DEPLOYER_PREVIOUS_PACKAGE_SIGNING_KEYS:-}
      - PRODUCTION_DEPLOYER_PREVIOUS_RECEIPT_SIGNING_KEYS=${PRODUCTION_DEPLOYER_PREVIOUS_RECEIPT_SIGNING_KEYS:-}
      - PRODUCTION_DEPLOYER_SLO_WINDOW_MIN_SAMPLES=${PRODUCTION_DEPLOYER_SLO_WINDOW_MIN_SAMPLES:-3}
      - PRODUCTION_DEPLOYER_SLO_WINDOW_PASS_RATIO=${PRODUCTION_DEPLOYER_SLO_WINDOW_PASS_RATIO:-1.0}
      - PRODUCTION_DEPLOYER_AUDIT_CHAIN_REQUIRED=${PRODUCTION_DEPLOYER_AUDIT_CHAIN_REQUIRED:-true}
      - PRODUCTION_DEPLOYER_MAX_CONCURRENT_ACTIVE=${PRODUCTION_DEPLOYER_MAX_CONCURRENT_ACTIVE:-10}
      - PRODUCTION_DEPLOYER_OPERATOR_CREDENTIALS_JSON=${PRODUCTION_DEPLOYER_OPERATOR_CREDENTIALS_JSON:-}
      - PRODUCTION_DEPLOYER_ALLOWED_OPERATOR_ROLES=${PRODUCTION_DEPLOYER_ALLOWED_OPERATOR_ROLES:-release-manager,ops,deployer}
      - PRODUCTION_DEPLOYER_AUTO_ROLLBACK_ENABLED=${PRODUCTION_DEPLOYER_AUTO_ROLLBACK_ENABLED:-true}
      - PRODUCTION_DEPLOYER_OUTCOME_CALLBACK_URL=${PRODUCTION_DEPLOYER_OUTCOME_CALLBACK_URL:-http://backend:8000/improvements/production-outcomes}
      - PRODUCTION_DEPLOYER_ALLOW_HTTP_CALLBACK=${PRODUCTION_DEPLOYER_ALLOW_HTTP_CALLBACK:-true}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8015/health/live', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  qdrant_data:
  scheduler_redis_data:
  scheduler_postgres_data:
  production_deployer_data:
